# Render Blueprint for Nijghor Server Relay & Managed Services
# Automatically creates the Go relay, PostgreSQL 16 database, and Redis cache.

services:
  - type: web
    name: nijghor-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: nijghor-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nijghor-redis
          property: connectionString
      - key: APP_BASE_URL
        value: https://nijghor.vercel.app # Set this to your actual Vercel URL
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: mock

  - type: redis
    name: nijghor-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only

databases:
  - name: nijghor-postgres
    databaseName: nijghor_db
    user: nijghor_user
    plan: starter
    region: oregon
