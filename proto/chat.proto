syntax = "proto3";

package nijghor.chat;

import "proto/signal.proto";

option go_package = "nijghor/server/proto/chat;chatpb";

// Main WebSocket Frame: Sent bidirectionally between client and server relay
message Frame {
  oneof payload {
    Ping ping = 1;
    Pong pong = 2;
    AuthHandshake auth_handshake = 3;
    AuthHandshakeAck auth_handshake_ack = 4;
    SendMessage send_message = 5;
    ReceiveMessage receive_message = 6;
    MessageAck message_ack = 7;
    DeliveryReceipt delivery_receipt = 8;
    TypingIndicator typing_indicator = 9;
    PresenceUpdate presence_update = 10;
    SubscribePresence subscribe_presence = 11;
    RoomAction room_action = 12;
    ErrorMessage error = 13;
  }
}

// Heartbeat
message Ping {
  int64 timestamp = 1;
}

message Pong {
  int64 timestamp = 1;
}

// WebSocket Authentication Handshake
message AuthHandshake {
  string access_token = 1;
  string client_version = 2;
  int64 last_received_seq = 3; // Resumption sequence for missed offline messages
}

message AuthHandshakeAck {
  bool authenticated = 1;
  string user_id = 2;
  string username = 3;
  int64 server_time = 4;
  int64 latest_seq = 5;
  int32 offline_messages_count = 6;
}

// Client Sending a Message
message SendMessage {
  string client_msg_id = 1; // UUID generated by client for idempotency & optimistic UI
  string room_id = 2;
  string recipient_id = 3; // For 1:1 chat, recipient user_id; empty if group
  bool is_group = 4;
  repeated string group_recipient_ids = 5; // List of member user_ids for fanout
  nijghor.signal.SignalEnvelope envelope = 6; // Opaque encrypted payload
  int64 client_timestamp = 7;
  int32 expires_in_seconds = 8; // Disappearing message timer (0 = infinite)
}

// Server Delivering a Message to Client
message ReceiveMessage {
  int64 seq_id = 1; // Server-assigned monotonic sequence ID
  string server_msg_id = 2;
  string client_msg_id = 3;
  string room_id = 4;
  string sender_id = 5;
  string sender_username = 6;
  bool is_group = 7;
  nijghor.signal.SignalEnvelope envelope = 8;
  int64 server_timestamp = 9;
  int32 expires_in_seconds = 10;
}

// Client Acknowledgement to Server (deletes offline queue message from Redis)
message MessageAck {
  string client_msg_id = 1;
  string server_msg_id = 2;
  int64 seq_id = 3;
}

// House-Tick Delivery & Read Receipts
enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  RECEIPT_STATUS_SENT = 1;       // Single outline house: reached server
  RECEIPT_STATUS_DELIVERED = 2;  // Filled house: reached recipient device
  RECEIPT_STATUS_READ = 3;       // Glowing house: recipient opened room
}

message DeliveryReceipt {
  string room_id = 1;
  string message_id = 2;
  ReceiptStatus status = 3;
  string sender_id = 4;    // Original message sender who receives receipt
  string reader_id = 5;    // Recipient generating this receipt
  int64 timestamp = 6;
}

// Typing Indicator
message TypingIndicator {
  string room_id = 1;
  string user_id = 2;
  string username = 3;
  bool is_typing = 4;
}

// Presence (Online / Last Seen)
message PresenceUpdate {
  string user_id = 1;
  bool is_online = 2;
  int64 last_seen_timestamp = 3;
}

message SubscribePresence {
  repeated string user_ids = 1;
}

// Group & Room Actions
enum RoomActionType {
  ROOM_ACTION_UNSPECIFIED = 0;
  ROOM_ACTION_CREATE_GROUP = 1;
  ROOM_ACTION_ADD_MEMBERS = 2;
  ROOM_ACTION_REMOVE_MEMBER = 3;
  ROOM_ACTION_LEAVE_GROUP = 4;
  ROOM_ACTION_UPDATE_TITLE = 5;
}

message RoomAction {
  string room_id = 1;
  RoomActionType action_type = 2;
  string actor_user_id = 3;
  repeated string target_user_ids = 4;
  string metadata_json = 5; // e.g. encrypted room title or avatar
}

// Error Message Frame
message ErrorMessage {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
}
