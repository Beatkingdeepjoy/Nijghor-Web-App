syntax = "proto3";

package nijghor.sync;

import "proto/chat.proto";

option go_package = "nijghor/server/proto/sync;syncpb";

// Sync Request when reconnecting after being offline
message SyncRequest {
  int64 last_seq_id = 1;
  int32 limit = 2; // Default 100, max 500
}

message SyncResponse {
  repeated nijghor.chat.ReceiveMessage messages = 1;
  repeated nijghor.chat.DeliveryReceipt receipts = 2;
  bool has_more = 3;
  int64 highest_seq_id = 4;
}

message SyncAck {
  int64 highest_acknowledged_seq_id = 1;
}
