services:
  caddy:
    image: caddy:2.8-alpine
    container_name: nijghor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - web
    networks:
      - nijghor-net

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: nijghor-server
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8080
      - DATABASE_URL=postgres://nijghor_user:nijghor_secret_pwd@postgres:5432/nijghor_db?sslmode=disable
      - REDIS_URL=redis://:nijghor_redis_pwd@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=nijghor_minio_admin
      - MINIO_SECRET_KEY=nijghor_minio_secret_pwd
      - MINIO_BUCKET=nijghor-media
      - MINIO_USE_SSL=false
      - JWT_ACCESS_SECRET=nijghor_super_secure_jwt_access_secret_change_in_prod_32b!
      - JWT_REFRESH_SECRET=nijghor_super_secure_jwt_refresh_secret_change_in_prod_32b!
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=mailto:admin@nijghor.internal
      - EMAIL_PROVIDER=mock
      - APP_BASE_URL=https://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nijghor-net

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: nijghor-web
    restart: unless-stopped
    networks:
      - nijghor-net

  postgres:
    image: postgres:16-alpine
    container_name: nijghor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nijghor_db
      POSTGRES_USER: nijghor_user
      POSTGRES_PASSWORD: nijghor_secret_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nijghor_user -d nijghor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nijghor-net

  redis:
    image: redis:7-alpine
    container_name: nijghor-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "nijghor_redis_pwd", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nijghor_redis_pwd", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nijghor-net

  minio:
    image: minio/minio:latest
    container_name: nijghor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nijghor_minio_admin
      MINIO_ROOT_PASSWORD: nijghor_minio_secret_pwd
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nijghor-net

  minio-init:
    image: minio/mc:latest
    container_name: nijghor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nijghor_minio_admin nijghor_minio_secret_pwd;
      mc mb --ignore-existing local/nijghor-media;
      mc ilm rule add --expire-days 30 local/nijghor-media;
      echo 'MinIO initialized with 30-day lifecycle auto-purge.';
      exit 0;
      "
    networks:
      - nijghor-net

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:

networks:
  nijghor-net:
    driver: bridge
